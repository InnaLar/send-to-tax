server:
  port: 8090 # ????, ?? ??????? ????? ??????? ??? ??????
  shutdown: graceful # ??? ??????????? ?????????? ?????? ??????????

logging:
  level:
    root: info

spring:
  flyway:
    baseline-on-migrate: true # ??????? ??????? flyway_schema_history, ???? ?? ???
    baseline-version: 0 # ????????? ?????? ????????
    locations: classpath:db/migration
    enabled: true # ???????? flyway
    default-schema: public
    schemas: public
    # Optional: custom name for the metadata table
    table: flyway_schema_history


  application:
    name: send-to-tax
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver # ??????? ??? ?????? ? postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false # ?????????? sql ??????? ? ???????
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect # ??????? ??? ?????? ? postgres
        format_sql: true # ????????????? sql ??????? ? ???????
    open-in-view: false
